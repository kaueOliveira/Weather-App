  <body>
    <header>
      <img src="assets/images/logo.svg" alt="logo" />
      <div id="units-menu-button">
        <img src="assets/images/icon-units.svg" alt="Icon Units" />
        <p>Units</p>
        <img
          src="assets/images/icon-dropdown.svg"
          alt="Dropdown"
          id="header-dropdown-button"
        />
      </div>
      <div id="unit-settings-dropdown">
        <button>Switch to Imperial</button>
        <button>Switch to Metric</button>
        <div>
          <h1>Temperature</h1>
          <button>Celsius (°C)</button>
          <button>Fahrenheit (°F)</button>
        </div>
        <div>
          <h1>Wind Speed</h1>
          <button>km/h</button>
          <button>mph</button>
        </div>
        <div>
          <h1>Precipitation</h1>
          <button>Millimeters (mm)</button>
          <button>Inches (in)</button>
        </div>
      </div>
    </header>

    <h1>How's the sky looking today?</h1>

    <section id="section-search">
      <div id="div-search">
        <img src="assets/images/icon-search.svg" alt="Icon Search" />
        <input
          type="text"
          placeholder="Search for a place..."
          id="input-text"
        />
      </div>
      <button id="button-search">Search</button>
      <div id="results"></div>
    </section>

        <div id="div-city-info">
          <h1 id="city-name"></h1>
          <p id="current-date"></p>
        </div>
        <div id="current-temperature">
          <img src="" alt="" id="current-weather-icon" />
          <p id="temperature"></p>
        </div>

        <div class="loading">
          Loading...
          <span class="dots">
            <span>.</span>
            <span>.</span>
            <span>.</span>
          </span>
        </div>
      </section>

      <section id="weather-details">
        <div id="weather-item">
          <p>Feels Like</p>
          <span id="feels-like-value">_</span>

        <div id="weather-item">
          <p>Humidity</p>

        <div id="weather-item">

        <div id="weather-item">
