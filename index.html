<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/media-queries.css" />
    <title>Frontend Mentor | Weather app</title>

  <body>
    <header>
      <img src="assets/images/logo.svg" alt="logo" />
      <div id="units-menu-button">
        <img src="assets/images/icon-units.svg" alt="Icon Units" />
        <p data-i18n="units">Units</p>
        <img
          src="assets/images/icon-dropdown.svg"
          alt="Dropdown"
          id="header-dropdown-button"
        />
      </div>
      <div id="unit-settings-dropdown">
        <button id="switch-imperial" data-i18n="switchToImperial">
          Switch to Imperial
        </button>
        <button id="switch-metric" data-i18n="switchToMetric">
          Switch to Metric
        </button>
        <div id="div-temperature-units">
          <h1 data-i18n="temperature">Temperature</h1>
          <button class="checked" id="celsius" data-i18n="celsius">
            Celsius (°C)
            <img src="assets/images/icon-checkmark.svg" alt="icon-checkmark" />
          </button>
          <button id="fahrenheit" data-i18n="fahrenheit">
            Fahrenheit (°F)
            <img src="assets/images/icon-checkmark.svg" alt="icon-checkmark" />
          </button>
        </div>
        <div id="div-speed-units">
          <h1 data-i18n="windSpeed">Wind Speed</h1>
          <button class="checked" id="kmh">
            km/h
            <img src="assets/images/icon-checkmark.svg" alt="icon-checkmark" />
          </button>
          <button id="mph">
            mph
            <img src="assets/images/icon-checkmark.svg" alt="icon-checkmark" />
          </button>
        </div>
        <div id="div-length-units">
          <h1 data-i18n="precipitation">Precipitation</h1>
          <button class="checked" id="mm" data-i18n="millimeters">
            Millimeters (mm)
            <img src="assets/images/icon-checkmark.svg" alt="icon-checkmark" />
          </button>
          <button id="inch" data-i18n="inches">
            Inches (in)
            <img src="assets/images/icon-checkmark.svg" alt="icon-checkmark" />
          </button>
        </div>
      </div>
    </header>

    <h1 data-i18n="title">How's the sky looking today?</h1>

    <section id="section-search">
      <div id="div-search">
        <img src="assets/images/icon-search.svg" alt="Icon Search" />
        <input
          type="text"
          placeholder="Search for a place..."
          id="input-text"
          data-i18n="placeholder"
        />
      </div>
      <button id="button-search" data-i18n="button">Search</button>
      <div id="results"></div>
    </section>

    <div id="container">
      <section id="current-weather">
        <div id="div-city-info">
          <h1 id="city-name"></h1>
          <p id="current-date"></p>
        </div>
        <div id="current-temperature">
          <img src="" alt="" id="current-weather-icon" />
          <p id="temperature"></p>
        </div>

        <div class="loading" data-i18n="loading">
          Loading...
          <span class="dots">
            <span>.</span>
            <span>.</span>
            <span>.</span>
          </span>
        </div>
      </section>

      <section id="weather-details">
        <div id="weather-item">
          <p data-i18n="feelsLike">Feels Like</p>
          <span id="feels-like-value">_</span>
        </div>
        <div id="weather-item">
          <p data-i18n="humidity">Humidity</p>
          <span id="humidity-value">_</span>
        </div>
        <div id="weather-item">
          <p data-i18n="wind">Wind</p>
          <span id="wind-speed-value">_</span>
        </div>
        <div id="weather-item">
          <p data-i18n="precipitation">Precipitation</p>
          <span id="precipitation-value">_</span>
        </div>
      </section>
